<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IBM Consultancy — Immigration, Passport &amp; Visa Services in Delhi</title>
    <meta
      name="description"
      content="IBM Consultancy, Delhi: visa and passport assistance, flight and hotel bookings, travel packages, travel insurance, study abroad and immigration support."
    />
    <meta name="theme-color" content="#FAFAF9" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo-320.webp" type="image/webp" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load without blocking first paint (text swaps in when ready) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300&family=Manrope:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300&family=Manrope:wght@400;500;600;700&display=swap" /></noscript>
    <!-- instant first paint: matches the preloader's opening frame until the app takes over -->
    <style>
      html,body{margin:0;background:#fafaf9}
      #boot{position:fixed;inset:0;z-index:250;background:#fafaf9;display:flex;justify-content:center}
      #boot img{width:88px;height:auto;margin-top:calc(22px + env(safe-area-inset-top))}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/logo-320.webp" alt="" width="88" height="78" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
